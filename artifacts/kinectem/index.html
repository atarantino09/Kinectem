<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Swallow the benign "ResizeObserver loop completed with undelivered
      // notifications" / "ResizeObserver loop limit exceeded" browser signal.
      // It fires a window `error` event whose `error` object is null (message
      // only), which @replit/vite-plugin-runtime-error-modal relabels as
      // "(unknown runtime error)" and pops up transiently (notably on mobile
      // while layout settles after login). This guard runs before the overlay
      // plugin's deferred module registers, so it wins listener ordering. It
      // only matches the message AND requires a null `error` object, so a real
      // error thrown inside an observer callback (non-null `error`) still
      // surfaces normally.
      (function () {
        window.addEventListener(
          "error",
          function (e) {
            if (
              e &&
              e.error == null &&
              typeof e.message === "string" &&
              e.message.indexOf("ResizeObserver loop") !== -1
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true,
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Kinectem</title>
    <meta name="theme-color" content="#0B1228" />
    <meta property="og:image" content="https://app.kinectem.com/brand/social/og-image-dark-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.kinectem.com/brand/social/og-image-dark-1200x630.png" />
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
    <link rel="manifest" href="brand/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
